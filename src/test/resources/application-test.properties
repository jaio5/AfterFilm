spring.datasource.url=jdbc:h2:mem:pelisapp-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.email.enabled=false
spring.mail.test-connection=false
app.google-books.load-on-startup=false
app.tmdb.load-on-startup=false
app.tmdb.series.load-on-startup=false
app.moderation.enabled=false
app.moderation.ollama.enabled=false

app.images.storage-path=target/test-data/images
app.movies.storage-path=target/test-data/movies
