# Datasource - Postgres (Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.eunfcumbhnihwubkkxkn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.data.jpa.repositories.bootstrap-mode=deferred
spring.main.lazy-initialization=true

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

server.port=${PORT:8080}

app.allow-healthcheck=true
app.dev-mode=false
app.tmdb.series.load-on-startup=false
app.google-books.load-on-startup=false

app.images.storage.provider=${IMAGES_STORAGE_PROVIDER:local}
app.images.storage-path=${APP_IMAGES_STORAGE_PATH:/tmp/afterfilm/images}
app.movies.storage-path=${APP_MOVIES_STORAGE_PATH:/tmp/afterfilm/movies}

app.base-url=${APP_BASE_URL:https://pelisapp.onrender.com}

app.images.supabase.url=${SUPABASE_URL:}
app.images.supabase.service-role=${SUPABASE_SERVICE_ROLE:}
app.images.supabase.bucket=${SUPABASE_BUCKET:}
app.images.supabase.prefix=${SUPABASE_PREFIX:afterfilm/images}
app.images.supabase.public-base-url=${SUPABASE_PUBLIC_BASE_URL:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=${MANAGEMENT_HEALTH_DB_ENABLED:false}
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.endpoint.health.show-details=never

app.email.enabled=${APP_EMAIL_ENABLED:true}
app.email.provider=${APP_EMAIL_PROVIDER:resend}

resend.api.key=${RESEND_API_KEY}
resend.api.url=${RESEND_API_URL:https://api.resend.com/emails}

spring.mail.from=${MAIL_FROM:no-reply@afterfilm.local}
spring.mail.test-connection=false