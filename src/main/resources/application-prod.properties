spring.profiles.active=prod

# Datasource - Postgres (Supabase)
# Prefer setting SPRING_DATASOURCE_URL directly in Render. Default uses Supabase Session Pooler.
# Pooler (IPv4 compatible): aws-1-eu-central-2.pooler.supabase.com:6543
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-eu-central-2.pooler.supabase.com:6543/postgres?sslmode=require}
# Supabase pooler provides a proxied username of the form 'postgres.<project>'
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.nuewaowsrclicowxxpre}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP tuned for small instances
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Server port
server.port=8080

# JVM options are set via JAVA_OPTS env var in Render (recommended)

# Application specific
app.allow-healthcheck=true
app.dev-mode=false

# Actuator - expose only health + info for minimal surface
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.endpoint.health.show-details=never
