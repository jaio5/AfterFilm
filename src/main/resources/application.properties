# Im?genes descargadas (por defecto en ./data/images y servidas en /images/**)
app.images.storage-path=./data/images
app.images.serve-base=/images

# Archivos de pel?culas
app.movies.storage-path=./data/movies
app.movies.serve-base=/movies
app.movies.max-file-size=4GB
app.movies.streaming.enabled=true

# AI Moderation Configuration - CONFIGURACI�N ESTRICTA
app.moderation.enabled=true
app.moderation.api.url=http://localhost:5000
app.moderation.toxicity.threshold=0.4
app.moderation.review.threshold=0.3
app.moderation.fallback.enabled=true



# Ollama Configuration for AI Moderation
# Si Ollama corre en WSL, cambia localhost por la IP de WSL: wsl hostname -I
app.moderation.ollama.url=http://localhost:11434
app.moderation.ollama.model=llama3
app.moderation.ollama.timeout=60
app.moderation.ollama.enabled=true
# Umbral del fallback local (ModeratingAI): score de limpieza, 0=tóxico, 1=limpio
app.moderation.ia.threshold=0.7

# Spring Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# Server Configuration
server.port=8082

# Modo desarrollo
app.dev-mode=false

# Credenciales del usuario admin inicial (cambiar en producción)
app.admin.initial-password=${APP_ADMIN_PASSWORD:admin123}

