spring.application.name=PelisApp

# Consola Windows legible; se puede sobrescribir con LOG_CHARSET_CONSOLE=UTF-8.
logging.charset.console=${LOG_CHARSET_CONSOLE:windows-1252}
logging.charset.file=UTF-8

# Logs legibles en consola y archivo.
logging.pattern.console=%d{HH:mm:ss} %-5level %-36.36logger{36} - %replace(%msg){'[\\p{So}\\uFE0F]',''}%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %-40.40logger{39} - %replace(%msg){'[\\p{So}\\uFE0F]',''}%n%wEx
logging.level.root=INFO
logging.level.alicanteweb.pelisapp=INFO


# --- Configuraci?n de DataSource (MySQL) - ajustar seg?n tu entorno ---
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_DB:PelisApp}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Iirlmne322*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT settings (no hard-codear el secreto)
# Use APP_JWT_SECRET env var in production. Default provided for local development (>=32 chars for HS256).
app.jwt.secret=${APP_JWT_SECRET:changeit_0123456789_changeit_0123456789}
app.jwt.access-expiration-ms=${APP_JWT_ACCESS_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# Google Books API Configuration
app.google-books.api-key=${GOOGLE_BOOKS_API_KEY:AIzaSyBd0mzIKitOAk1DwPPRbMKgd1HyQ5GUm1E}
# Carga automática de libros al iniciar (solo si la BD está vacía)
app.google-books.load-on-startup=true
# Máximo libros por consulta en el arranque
app.google-books.startup-max-per-query=20
# Restricción de idioma para búsquedas (vacío = sin restricción, 'es' = solo español)
app.google-books.lang-restrict=

