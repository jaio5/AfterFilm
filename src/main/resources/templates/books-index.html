<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afterfilms — Libros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <img src="/images/logo.png" alt="Afterfilms" class="site-logo">
            </a>
            <div class="navbar-search">
                <form id="searchForm">
                    <input type="search" id="searchInput" placeholder="Buscar libros..." autocomplete="off">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>
            <button class="navbar-menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" onclick="const nav=this.closest('.navbar'); nav.classList.toggle('menu-open'); this.setAttribute('aria-expanded', nav.classList.contains('menu-open'));"><i class="fas fa-bars"></i></button>

            <div class="navbar-nav-links">
                <a th:href="@{/}"><i class="fas fa-film"></i> Películas</a>
                <a th:href="@{/series}"><i class="fas fa-tv"></i> Series</a>
                <a th:href="@{/libros}" style="color:var(--accent)"><i class="fas fa-book"></i> Libros</a>
                <a th:href="@{/usuarios}"><i class="fas fa-users"></i> Usuarios</a>
                <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Entrar</a>
                <a th:href="@{/register}" sec:authorize="!isAuthenticated()" class="btn-accent btn-sm">Registrarse</a>
                <div class="user-menu" sec:authorize="isAuthenticated()">
                    <button class="user-avatar-btn" id="userAvatarBtn">
                        <span class="user-avatar-initial" th:text="${#authentication.name.substring(0,1)}">U</span>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="user-dropdown-header">
                            <span class="user-dropdown-name" th:text="${#authentication.name}">Usuario</span>
                        </div>
                        <a th:href="@{/perfil}" class="user-dropdown-item"><i class="fas fa-user"></i> Mi perfil</a>
                        <a th:href="@{/feed}" class="user-dropdown-item"><i class="fas fa-stream"></i> Mi feed</a>
                        <a th:href="@{/chat}" class="user-dropdown-item"><i class="fas fa-comments"></i> Mensajes</a>
                        <a th:href="@{/perfil}" class="user-dropdown-item"><i class="fas fa-cog"></i> Ajustes</a>
                        <a th:href="@{/admin}"
                           th:if="${#authentication.authorities.?[authority == 'ROLE_ADMIN'].size() > 0}"
                           class="user-dropdown-item user-dropdown-item-admin"><i class="fas fa-shield-alt"></i> Panel de Admin</a>
                        <div class="user-dropdown-divider"></div>
                        <form th:action="@{/logout}" method="post" style="margin:0">
                            <button type="submit" class="user-dropdown-item user-dropdown-item-logout"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="books-hero" id="booksHeroSection" style="display:none">
        <div class="books-hero-backdrop" id="booksHeroBackdrop"></div>
        <div class="books-hero-gradient"></div>
        <div class="books-hero-content">
            <div class="books-hero-copy">
                <div class="hero-eyebrow" id="booksHeroEyebrow"></div>
                <h2 class="hero-title" id="booksHeroTitle"></h2>
                <p class="hero-synopsis" id="booksHeroSynopsis"></p>
                <div class="books-hero-meta" id="booksHeroMeta"></div>
                <div class="hero-actions">
                    <a class="btn-accent" id="booksHeroWatchLink" href="#"><i class="fas fa-star"></i> Leer reseñas</a>
                    <a class="btn-ghost" id="booksHeroInfoLink" href="#">+ Más info</a>
                </div>
            </div>
            <div class="books-hero-cover">
                <img id="booksHeroCover" alt="Portada destacada del mes" loading="eager">
            </div>
        </div>
    </section>

    <!-- Main -->
    <div class="container-main">
        <div class="catalog-layout">

            <!-- Sidebar categorías -->
            <aside class="catalog-sidebar" id="sidebarCategories">
                <div class="sidebar-section-title"><i class="fas fa-th-list"></i> Categorías</div>
                <button class="sidebar-pill active" data-category="">Todos</button>
            </aside>

            <!-- Contenido -->
            <div class="catalog-main">
                <div class="catalog-bar">
                    <span class="catalog-title" id="catalog-title">Libros</span>
                    <span class="catalog-count" id="catalog-info"></span>
                </div>
                <div id="books-container" class="movies-grid"></div>
                <div id="pagination-container"></div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        © 2026 Afterfilms — Hecho con <i class="fas fa-heart text-accent"></i> por los libros
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
const booksContainer = document.getElementById('books-container');
const paginationContainer = document.getElementById('pagination-container');
const catalogTitle = document.getElementById('catalog-title');
const catalogInfo = document.getElementById('catalog-info');
const booksHeroSection = document.getElementById('booksHeroSection');
const PAGE_SIZE = 24;

let currentPage = 0;
let currentCategory = null;
let currentSearchQuery = null;
let searchTimeout = null;

function normalizeBookCoverUrl(url) {
    if (!url) return null;
    return url.replace('http://', 'https://').replace('zoom=1', 'zoom=0').replace('&edge=curl', '');
}

function resolveBookPoster(book) {
    return book ? normalizeBookCoverUrl(book.coverUrl) : null;
}

function toggleBooksHero(show) {
    if (!booksHeroSection) return;
    booksHeroSection.style.display = show ? '' : 'none';
}

function populateHero(book) {
    const poster = resolveBookPoster(book);
    if (!booksHeroSection) return;
    document.getElementById('booksHeroBackdrop').style.backgroundImage = poster
        ? `url('${poster}')`
        : 'radial-gradient(circle at top, rgba(255,107,53,0.25), transparent 45%), linear-gradient(135deg, #1a1010, #0f1115)';
    document.getElementById('booksHeroEyebrow').textContent = '★ Libro destacado del mes';
    document.getElementById('booksHeroTitle').textContent = book.title || '';
    document.getElementById('booksHeroSynopsis').textContent = book.description || book.publisher || '';
    document.getElementById('booksHeroMeta').innerHTML = `
        ${book.authors ? `<span class="hero-meta-pill"><i class="fas fa-feather-alt"></i> ${book.authors}</span>` : ''}
        ${book.avgRating ? `<span class="hero-meta-pill"><i class="fas fa-star"></i> ${Number(book.avgRating).toFixed(1)} · ${book.reviewCount || 0} reseñas</span>` : `<span class="hero-meta-pill"><i class="fas fa-book"></i> ${book.reviewCount || 0} reseñas</span>`}
        ${book.publishedDate ? `<span class="hero-meta-pill"><i class="fas fa-calendar-alt"></i> ${book.publishedDate}</span>` : ''}
    `;
    const heroCover = document.getElementById('booksHeroCover');
    if (poster) {
        heroCover.src = poster;
        heroCover.style.display = '';
    } else {
        heroCover.removeAttribute('src');
        heroCover.style.display = 'none';
    }
    const url = `/libro/${book.id}`;
    document.getElementById('booksHeroWatchLink').href = url;
    document.getElementById('booksHeroInfoLink').href = url;
    toggleBooksHero(true);
}

function loadBooks(page = 0, category = currentCategory) {
    currentCategory = category;
    const url = category
        ? `/api/books/by-category?category=${encodeURIComponent(category)}&page=${page}&size=${PAGE_SIZE}`
        : `/api/books?page=${page}&size=${PAGE_SIZE}`;
    toggleBooksHero(!category && !currentSearchQuery);
    fetch(url)
        .then(res => res.json())
        .then(data => {
            renderBooks(data.content);
            renderPagination(data);
            catalogInfo.textContent = `${data.numberOfElements} de ${data.totalElements} libros`;
            currentPage = data.number;
        });
}

function renderBooks(items) {
    booksContainer.innerHTML = '';
    if (!items || items.length === 0) {
        booksContainer.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <i class="fas fa-book"></i>
                <p>No hay libros disponibles. Importa libros desde el panel admin.</p>
            </div>`;
        return;
    }
    items.forEach(b => {
        const coverSrc = resolveBookPoster(b);
        booksContainer.innerHTML += `
        <div class="movie-card">
            <a href="/libro/${b.id}" class="movie-card-link">
                <div class="movie-poster-wrap book-poster-wrap">
                    ${coverSrc
                        ? `<img src="${coverSrc}" alt="${b.title}" loading="lazy">`
                        : `<div class="movie-poster-placeholder"><i class="fas fa-book"></i></div>`}
                    ${b.avgRating ? `<div class="movie-rating-badge">
                        <i class="fas fa-star"></i> ${Number(b.avgRating).toFixed(1)}
                    </div>` : ''}
                    <div class="movie-card-overlay">
                        <div class="movie-card-overlay-info">
                            <div class="movie-card-overlay-title">${b.title || 'Sin título'}</div>
                            <div class="movie-card-overlay-year">${b.authors || ''}</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>`;
    });
}

function renderPagination(data) {
    paginationContainer.innerHTML = '';
    if (data.totalPages <= 1) return;
    let html = `<nav><ul class="pagination">`;
    html += `<li class="page-item${data.first ? ' disabled' : ''}"><a class="page-link" href="#" onclick="loadBooks(${data.number - 1});return false;"><i class="fas fa-chevron-left"></i></a></li>`;
    for (let i = 0; i < data.totalPages; i++) {
        if (Math.abs(i - data.number) <= 2) {
            html += `<li class="page-item${i === data.number ? ' active' : ''}"><a class="page-link" href="#" onclick="loadBooks(${i});return false;">${i + 1}</a></li>`;
        }
    }
    html += `<li class="page-item${data.last ? ' disabled' : ''}"><a class="page-link" href="#" onclick="loadBooks(${data.number + 1});return false;"><i class="fas fa-chevron-right"></i></a></li>`;
    html += `</ul></nav>`;
    paginationContainer.innerHTML = html;
}

function selectCategory(category) {
    document.querySelectorAll('#sidebarCategories .sidebar-pill').forEach(b => b.classList.toggle('active', b.dataset.category === category));
    catalogTitle.textContent = category || 'Libros';
    currentSearchQuery = null;
    toggleBooksHero(!category);
    loadBooks(0, category || null);
}

document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/books/top-rated-this-month')
        .then(res => res.ok ? res.json() : null)
        .then(book => { if (book) populateHero(book); });

    // Cargar categorías en el sidebar
    fetch('/api/books/categories')
        .then(res => res.json())
        .then(categories => {
            const sidebar = document.getElementById('sidebarCategories');
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'sidebar-pill';
                btn.dataset.category = cat;
                btn.textContent = cat;
                sidebar.appendChild(btn);
            });
            sidebar.addEventListener('click', function(e) {
                const btn = e.target.closest('.sidebar-pill');
                if (!btn) return;
                selectCategory(btn.dataset.category);
            });
        });

    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    if (searchForm && searchInput) {
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const query = searchInput.value.trim();
            currentSearchQuery = query || null;
            if (!query) { loadBooks(0, null); return; }
            toggleBooksHero(false);
            fetch(`/api/books/search?query=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    renderBooks(data);
                    paginationContainer.innerHTML = '';
                    catalogTitle.textContent = `"${query}"`;
                    catalogInfo.textContent = `${data.length} resultado${data.length !== 1 ? 's' : ''}`;
                });
        });
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function() {
                searchForm.requestSubmit();
            }, 250);
        });

        searchInput.addEventListener('search', function() {
            if (!this.value) {
                currentSearchQuery = null;
                loadBooks(0, currentCategory);
            }
        });
    }
    loadBooks(0);
});
    </script>
<script>
(function() {
    var btn = document.getElementById('userAvatarBtn');
    var dd = document.getElementById('userDropdown');
    if (!btn || !dd) return;
    btn.addEventListener('click', function(e) { e.stopPropagation(); dd.classList.toggle('open'); });
    document.addEventListener('click', function() { dd.classList.remove('open'); });
})();
</script>
</body>
</html>
