<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — AfterFilm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16.png}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="auth-page" style="padding: 2rem 1rem;">
        <div class="auth-card" style="max-width:480px;">

            <div class="auth-logo">
                <div class="auth-logo-icon"><img th:src="@{/logo.png}" src="/logo.png" alt="Afterfilms"></div>
                <p class="auth-logo-subtitle">Crea tu cuenta gratuita</p>
            </div>

            <div th:if="${error}" class="alert-msg alert-msg-danger">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" method="post" th:object="${user}">

                <div class="form-field">
                    <label class="form-label" for="username">Nombre de usuario</label>
                    <input type="text" class="form-input" id="username" th:field="*{username}"
                           placeholder="Obligatorio, 3-20 caracteres" required minlength="3" maxlength="20"
                           pattern="^[a-zA-Z0-9_]+$" autocomplete="username">
                    <span class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                    <span class="form-error" th:if="${errorUsername}" th:text="${errorUsername}"></span>
                    <span class="form-hint">Solo letras, números y guiones bajos</span>
                </div>

                <div class="form-field">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <input type="email" class="form-input" id="email" th:field="*{email}"
                           placeholder="tu@email.com" required autocomplete="email">
                    <span class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    <span class="form-error" th:if="${errorEmail}" th:text="${errorEmail}"></span>
                </div>

                <div class="form-field">
                    <label class="form-label" for="displayName">
                        Nombre real
                        <span style="color:var(--text-muted);font-size:0.75rem;text-transform:none;letter-spacing:0;font-weight:400;">(opcional)</span>
                    </label>
                    <input type="text" class="form-input" id="displayName" th:field="*{displayName}"
                           placeholder="Tu nombre, si quieres mostrarlo" autocomplete="name">
                    <span class="form-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></span>
                </div>

                <div class="form-field">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" class="form-input" id="password" th:field="*{password}"
                           placeholder="Mínimo 8 caracteres" required minlength="8" maxlength="128"
                           autocomplete="new-password">
                    <span class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    <span class="form-error" th:if="${errorPasswordWeak}" th:text="${errorPasswordWeak}"></span>
                    <span class="form-hint">Mayúscula, minúscula, número y carácter especial</span>
                </div>

                <div class="form-field">
                    <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" class="form-input" id="confirmPassword" name="confirmPassword"
                           placeholder="Repite tu contraseña" required autocomplete="new-password">
                    <span class="form-error" th:if="${errorPassword}" th:text="${errorPassword}"></span>
                </div>

                <div style="display:flex;align-items:flex-start;gap:0.5rem;margin-bottom:1.5rem;">
                    <input type="checkbox" id="acceptTerms" required
                           style="margin-top:3px;width:1rem;height:1rem;accent-color:var(--accent);cursor:pointer;flex-shrink:0;">
                    <label for="acceptTerms" style="font-size:0.85rem;color:var(--text-muted);cursor:pointer;line-height:1.4;">
                        Acepto los <a href="#" style="color:var(--text-secondary);">términos y condiciones</a>
                    </label>
                </div>

                <button type="submit" class="btn-accent" style="width:100%;justify-content:center;">
                    <i class="fas fa-user-plus"></i> Crear cuenta
                </button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes cuenta? <a th:href="@{/login}">Iniciar sesión</a>
                &nbsp;·&nbsp;
                <a th:href="@{/}"><i class="fas fa-arrow-left"></i> Inicio</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            function validatePasswords() {
                confirmPassword.setCustomValidity(
                    password.value !== confirmPassword.value ? 'Las contraseñas no coinciden' : ''
                );
            }
            password.addEventListener('change', validatePasswords);
            confirmPassword.addEventListener('keyup', validatePasswords);
        });
    </script>
</body>
</html>
