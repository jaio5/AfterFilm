<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — AfterFilm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16.png}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">

            <div class="auth-logo">
                <div class="auth-logo-icon"><img th:src="@{/images/logo.png}" src="/images/logo.png" alt="Afterfilms"></div>
                <p class="auth-logo-subtitle">Inicia sesión en tu cuenta</p>
            </div>

            <div th:if="${param.error}" class="alert-msg alert-msg-danger">
                <i class="fas fa-exclamation-circle"></i>
                <div>
                    <span th:if="${param.error[0] == 'true'}">Credenciales incorrectas o cuenta no confirmada.</span>
                    <span th:unless="${param.error[0] == 'true'}" th:text="${param.error[0]}">Error</span>
                    <div class="resend-section">
                        <button type="button" class="btn-text" style="font-size:0.8rem;margin-top:0.5rem;" onclick="showResendForm()">
                            <i class="fas fa-envelope"></i> Reenviar confirmación
                        </button>
                        <form id="resendForm" class="d-none" style="margin-top:0.75rem;" onsubmit="return resendConfirmation(event)">
                            <div style="display:flex;gap:0.5rem;">
                                <input type="email" class="form-input" id="resendEmail" name="resendEmail" placeholder="Tu email" required style="flex:1">
                                <button type="submit" class="btn-accent btn-sm">Reenviar</button>
                            </div>
                            <div id="resendResult" class="form-hint" style="margin-top:0.4rem;"></div>
                        </form>
                    </div>
                </div>
            </div>

            <div th:if="${param.logout}" class="alert-msg alert-msg-success">
                <i class="fas fa-check-circle"></i>
                Sesión cerrada correctamente.
            </div>

            <div th:if="${success != null and !success.isEmpty()}" class="alert-msg alert-msg-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${success}"></span>
            </div>

            <div th:if="${param.confirmed}" class="alert-msg alert-msg-success">
                <i class="fas fa-check-circle"></i>
                ¡Cuenta confirmada! Ya puedes iniciar sesión.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-field">
                    <label class="form-label" for="username">Usuario</label>
                    <input type="text" class="form-input" id="username" name="username"
                           placeholder="Tu nombre de usuario" required autocomplete="username">
                </div>
                <div class="form-field">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" class="form-input" id="password" name="password"
                           placeholder="Tu contraseña" required autocomplete="current-password">
                </div>
                <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1.5rem;">
                    <input type="checkbox" id="remember-me" name="remember-me"
                           style="width:1rem;height:1rem;accent-color:var(--accent);cursor:pointer;flex-shrink:0;">
                    <label for="remember-me" style="font-size:0.85rem;color:var(--text-muted);margin:0;cursor:pointer;">Recordarme</label>
                </div>
                <button type="submit" class="btn-accent" style="width:100%;justify-content:center;">
                    Iniciar Sesión
                </button>
            </form>

            <div class="auth-divider">o</div>

            <a th:href="@{/register}" class="btn-ghost" style="width:100%;justify-content:center;">
                <i class="fas fa-user-plus"></i> Crear cuenta nueva
            </a>

            <div class="auth-footer">
                <a th:href="@{/}"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showResendForm() {
            document.getElementById('resendForm').classList.remove('d-none');
        }

        function resendConfirmation(event) {
            event.preventDefault();
            const email = document.getElementById('resendEmail').value;
            const resultDiv = document.getElementById('resendResult');
            resultDiv.textContent = 'Enviando...';
            fetch('/resend-confirmation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'email=' + encodeURIComponent(email)
            })
            .then(r => r.json())
            .then(data => {
                resultDiv.textContent = data.message;
                resultDiv.style.color = data.success ? 'var(--text-secondary)' : '#fca5a5';
            })
            .catch(() => { resultDiv.textContent = 'Error reenviando el email.'; });
            return false;
        }
    </script>
</body>
</html>
