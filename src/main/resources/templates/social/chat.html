<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes — AfterFilm</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><img th:src="@{/logo.png}" src="/logo.png" alt="Afterfilms" class="site-logo"></a>
        <button class="navbar-menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" onclick="const nav=this.closest('.navbar'); nav.classList.toggle('menu-open'); this.setAttribute('aria-expanded', nav.classList.contains('menu-open'));"><i class="fas fa-bars"></i></button>

        <div class="navbar-nav-links">
            <a th:href="@{/}"><i class="fas fa-film"></i> Películas</a>
            <a th:href="@{/series}"><i class="fas fa-tv"></i> Series</a>
            <a th:href="@{/libros}"><i class="fas fa-book"></i> Libros</a>
            <a th:href="@{/usuarios}"><i class="fas fa-users"></i> Usuarios</a>
            <div class="user-menu" sec:authorize="isAuthenticated()">
                <button class="user-avatar-btn" id="userAvatarBtn">
                    <span class="user-avatar-initial" th:text="${#authentication.name.substring(0,1)}">U</span>
                    <span th:if="${unreadCount > 0}" class="chat-nav-badge" th:text="${unreadCount}">1</span>
                </button>
                <div class="user-dropdown" id="userDropdown">
                    <div class="user-dropdown-header">
                        <span class="user-dropdown-name" th:text="${#authentication.name}">Usuario</span>
                    </div>
                    <a th:href="@{/perfil}" class="user-dropdown-item"><i class="fas fa-user"></i> Mi perfil</a>
                    <a th:href="@{/feed}" class="user-dropdown-item"><i class="fas fa-stream"></i> Mi feed</a>
                    <a th:href="@{/chat}" class="user-dropdown-item" style="color:var(--accent)"><i class="fas fa-comments"></i> Mensajes</a>
                    <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')"
                       class="user-dropdown-item user-dropdown-item-admin"><i class="fas fa-shield-alt"></i> Admin</a>
                    <div class="user-dropdown-divider"></div>
                    <form th:action="@{/logout}" method="post" style="margin:0">
                        <button type="submit" class="user-dropdown-item user-dropdown-item-logout"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Chat layout -->
<div class="chat-layout">

    <!-- Sidebar: conversations -->
    <div class="chat-sidebar">
        <div class="chat-sidebar-header">
            <span>Mensajes</span>
            <a th:href="@{/usuarios}" class="btn-ghost btn-sm" style="font-size:0.75rem;padding:0.25rem 0.6rem;">
                <i class="fas fa-plus"></i> Nuevo
            </a>
        </div>

        <div th:if="${#lists.isEmpty(partners)}" class="chat-empty-sidebar">
            <i class="fas fa-comment-slash"></i>
            <p>Ninguna conversación aún</p>
            <a th:href="@{/usuarios}" class="btn-accent btn-sm" style="margin-top:0.75rem;">Buscar usuarios</a>
        </div>

        <a th:each="p : ${partners}"
           th:href="@{/chat/{un}(un=${p.username})}"
           th:classappend="${activePartner != null and activePartner == p.username} ? ' active' : ''"
           class="chat-contact">
            <div class="chat-contact-avatar" th:text="${p.displayName.substring(0,1).toUpperCase()}">U</div>
            <div class="chat-contact-info">
                <div class="chat-contact-name-row">
                    <span class="chat-contact-name" th:text="${p.displayName}">Nombre</span>
                    <i th:if="${p.starred}" class="fas fa-star chat-contact-star"></i>
                    <span th:if="${p.unreadCount > 0}" class="chat-contact-unread" th:text="${p.unreadCount}">1</span>
                </div>
                <div class="chat-contact-handle" th:text="'@' + ${p.username}">@usuario</div>
                <div class="chat-contact-preview" th:if="${p.lastMessage != null}" th:text="${p.lastMessage}">Ultimo mensaje</div>
            </div>
        </a>
    </div>

    <!-- Main: messages area -->
    <div class="chat-main">

        <!-- No conversation selected -->
        <div th:if="${otherUser == null}" class="chat-welcome">
            <i class="fas fa-comments" style="font-size:3rem;color:var(--text-muted);margin-bottom:1rem;"></i>
            <p style="color:var(--text-secondary);">Selecciona una conversación o busca un usuario</p>
            <a th:href="@{/usuarios}" class="btn-accent btn-sm" style="margin-top:1rem;">
                <i class="fas fa-search"></i> Buscar usuarios
            </a>
        </div>

        <!-- Active conversation -->
        <div th:if="${otherUser != null}" id="chatConversation" style="display:flex;flex-direction:column;height:100%;">

            <!-- Chat header -->
            <div class="chat-header">
                <div class="chat-contact-avatar" th:text="${otherUser.displayName.substring(0,1).toUpperCase()}">U</div>
                <div>
                    <div class="chat-header-name" th:text="${otherUser.displayName}">Nombre</div>
                    <div class="chat-header-handle" th:text="'@' + ${otherUser.username}">@usuario</div>
                </div>
                <a th:href="@{/usuario/{un}(un=${otherUser.username})}" class="btn-ghost btn-sm" style="margin-left:auto;">
                    <i class="fas fa-user"></i> Perfil
                </a>
                <button type="button" id="starConversationBtn" class="chat-icon-action" title="Destacar chat">
                    <i class="far fa-star"></i>
                </button>
                <button type="button" id="deleteConversationBtn" class="chat-icon-action danger" title="Eliminar chat">
                    <i class="fas fa-trash"></i>
                </button>
            </div>

            <!-- Messages -->
            <div class="chat-messages" id="chatMessages">
                <div class="chat-loading"><i class="fas fa-circle-notch fa-spin"></i></div>
            </div>

            <!-- Input -->
            <div class="chat-input-area">
                <!-- Share content panel -->
                <div id="sharePanel" class="chat-share-panel" style="display:none">
                    <span style="color:var(--text-muted);font-size:0.8rem;">Compartir:</span>
                    <button class="chat-share-type active" data-type="movie" onclick="setShareType('movie')"><i class="fas fa-film"></i> Película</button>
                    <button class="chat-share-type" data-type="series" onclick="setShareType('series')"><i class="fas fa-tv"></i> Serie</button>
                    <button class="chat-share-type" data-type="book" onclick="setShareType('book')"><i class="fas fa-book"></i> Libro</button>
                    <input type="text" id="shareSearch" placeholder="Buscar título…" class="chat-share-search" oninput="searchContent()">
                    <div id="shareResults" class="chat-share-results"></div>
                </div>

                <!-- Attached content preview -->
                <div id="sharedContentPreview" class="chat-shared-preview" style="display:none">
                    <i class="fas fa-film" id="sharedIcon"></i>
                    <span id="sharedTitle"></span>
                    <button onclick="clearShared()" class="chat-share-remove"><i class="fas fa-times"></i></button>
                </div>

                <div class="chat-input-row">
                    <button class="chat-attach-btn" id="toggleShareBtn" title="Compartir contenido"
                            onclick="toggleSharePanel()">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <textarea id="msgInput" class="chat-textarea" placeholder="Escribe un mensaje…"
                              rows="1" oninput="autoResize(this)"
                              onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                    <button class="chat-send-btn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Hidden data -->
<div th:if="${otherUser != null}">
    <span id="otherUsername" th:text="${otherUser.username}" style="display:none"></span>
    <span id="currentUsername" th:text="${currentUsername}" style="display:none"></span>
    <span id="activeStarred" th:text="${activeStarred}" style="display:none"></span>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

    // ── Navbar dropdown ───────────────────────────────────────────────────────
    var btn = document.getElementById('userAvatarBtn');
    var dd  = document.getElementById('userDropdown');
    if (btn && dd) {
        btn.addEventListener('click', function(e) { e.stopPropagation(); dd.classList.toggle('open'); });
        document.addEventListener('click', function() { dd.classList.remove('open'); });
    }

    // ── Chat logic ────────────────────────────────────────────────────────────
    var otherUsernameEl = document.getElementById('otherUsername');
    if (!otherUsernameEl) return; // no hay conversación activa

    var otherUsername  = otherUsernameEl.textContent.trim();
    var currentUsername = document.getElementById('currentUsername').textContent.trim();
    var activeStarredEl = document.getElementById('activeStarred');
    var activeStarred = activeStarredEl && activeStarredEl.textContent.trim() === 'true';
    var sharedContent  = null;
    var shareType      = 'movie';
    var searchTimeout  = null;
    var lastMessageCount = 0;

    // Carga inicial y polling cada 4 s
    loadMessages(true);
    setInterval(function() { loadMessages(false); }, 4000);

    // ── Funciones expuestas al HTML ────────────────────────────────────────────
    window.sendMessage      = sendMessage;
    window.autoResize       = autoResize;
    window.toggleSharePanel = toggleSharePanel;
    window.setShareType     = setShareType;
    window.searchContent    = searchContent;
    window.selectContent    = selectContent;
    window.clearShared      = clearShared;

    var starBtn = document.getElementById('starConversationBtn');
    var deleteBtn = document.getElementById('deleteConversationBtn');
    if (starBtn) {
        updateStarButton();
        starBtn.addEventListener('click', toggleConversationStar);
    }
    if (deleteBtn) {
        deleteBtn.addEventListener('click', deleteConversation);
    }

    // ── Mensajes ──────────────────────────────────────────────────────────────
    function loadMessages(scrollBottom) {
        fetch('/api/chat/messages/' + otherUsername)
            .then(function(r) { return r.json(); })
            .then(function(messages) {
                var shouldScroll = scrollBottom || messages.length !== lastMessageCount;
                lastMessageCount = messages.length;
                renderMessages(messages, shouldScroll);
            })
            .catch(function() {});
    }

    function renderMessages(messages, scrollBottom) {
        var container = document.getElementById('chatMessages');
        if (!container) return;
        if (messages.length === 0) {
            container.innerHTML = '<div class="chat-no-msgs"><i class="fas fa-comment-dots"></i><p>Sin mensajes aún. ¡Di hola!</p></div>';
            return;
        }
        var html = '';
        var lastDate = '';
        messages.forEach(function(msg) {
            var d = new Date(msg.sentAt);
            var dateStr = d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
            if (dateStr !== lastDate) {
                html += '<div class="chat-date-sep"><span>' + dateStr + '</span></div>';
                lastDate = dateStr;
            }
            var isMine = msg.senderUsername === currentUsername;
            var time   = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            html += '<div class="chat-msg ' + (isMine ? 'chat-msg-mine' : 'chat-msg-theirs') + '">';
            if (msg.sharedContentType) {
                var icon = msg.sharedContentType === 'series' ? 'fa-tv' : (msg.sharedContentType === 'book' ? 'fa-book' : 'fa-film');
                var link = msg.sharedContentType === 'series' ? '/serie/' : (msg.sharedContentType === 'book' ? '/libro/' : '/pelicula/');
                html += '<a href="' + link + msg.sharedContentId + '" class="chat-shared-card">';
                var sharedPoster = normalizePosterUrl(msg.sharedContentPoster || '');
                if (sharedPoster) {
                    html += '<img src="' + escapeHtml(sharedPoster) + '" class="chat-shared-poster" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div class="chat-shared-poster-placeholder" style="display:none"><i class="fas ' + icon + '"></i></div>';
                } else {
                    html += '<div class="chat-shared-poster-placeholder"><i class="fas ' + icon + '"></i></div>';
                }
                html += '<span>' + escapeHtml(msg.sharedContentTitle) + '</span></a>';
            }
            html += '<div class="chat-bubble">' + escapeHtml(msg.content) + '</div>';
            html += '<div class="chat-time">' + time + (isMine ? (msg.read ? ' ✓✓' : ' ✓') : '') + '</div>';
            html += '</div>';
        });
        container.innerHTML = html;
        if (scrollBottom) container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
        var input = document.getElementById('msgInput');
        var text  = input.value.trim();
        if (!text) return;
        var payload = { content: text };
        if (sharedContent) {
            payload.sharedContentType  = sharedContent.type;
            payload.sharedContentId    = sharedContent.id;
            payload.sharedContentTitle = sharedContent.title;
            payload.sharedContentPoster = sharedContent.poster || null;
        }
        fetch('/api/chat/messages/' + otherUsername, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(function(r) { return r.json(); })
        .then(function() {
            input.value = '';
            autoResize(input);
            clearShared();
            loadMessages(true);
        });
    }

    function toggleConversationStar() {
        fetch('/api/chat/conversations/' + encodeURIComponent(otherUsername) + '/star?starred=' + (!activeStarred), {
            method: 'POST'
        })
        .then(function(r) {
            if (!r.ok) throw new Error('star failed');
            return r.json();
        })
        .then(function(data) {
            activeStarred = !!data.starred;
            updateStarButton();
        })
        .catch(function() { alert('No se pudo actualizar el destacado.'); });
    }

    function updateStarButton() {
        if (!starBtn) return;
        starBtn.classList.toggle('active', activeStarred);
        starBtn.innerHTML = activeStarred ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
        starBtn.title = activeStarred ? 'Quitar destacado' : 'Destacar chat';
    }

    function deleteConversation() {
        if (!confirm('Eliminar este chat de tu lista? Los mensajes se ocultaran solo para ti.')) return;
        fetch('/api/chat/conversations/' + encodeURIComponent(otherUsername), { method: 'DELETE' })
            .then(function(r) {
                if (!r.ok) throw new Error('delete failed');
                window.location.href = '/chat';
            })
            .catch(function() { alert('No se pudo eliminar el chat.'); });
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // ── Compartir contenido ────────────────────────────────────────────────────
    function toggleSharePanel() {
        var panel = document.getElementById('sharePanel');
        var visible = panel.style.display !== 'none';
        panel.style.display = visible ? 'none' : '';
        if (!visible) document.getElementById('shareSearch').focus();
    }

    function setShareType(type) {
        shareType = type;
        document.querySelectorAll('.chat-share-type').forEach(function(b) {
            b.classList.toggle('active', b.dataset.type === type);
        });
        document.getElementById('shareResults').innerHTML = '';
        document.getElementById('shareSearch').value = '';
    }

    function searchContent() {
        clearTimeout(searchTimeout);
        var q = document.getElementById('shareSearch').value.trim();
        if (q.length < 2) { document.getElementById('shareResults').innerHTML = ''; return; }
        searchTimeout = setTimeout(function() {
            var url = shareType === 'movie'  ? '/api/movies/search?query='  + encodeURIComponent(q) :
                      shareType === 'series' ? '/api/series/search?query='  + encodeURIComponent(q) :
                                              '/api/books/search?query='   + encodeURIComponent(q);
            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(results) {
                    renderShareResults(Array.isArray(results) ? results : (results.content || []));
                })
                .catch(function() {});
        }, 300);
    }

    function renderShareResults(items) {
        var container = document.getElementById('shareResults');
        if (!items || items.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;padding:0.5rem;">Sin resultados</div>';
            return;
        }
        container.innerHTML = items.slice(0, 8).map(function(item) {
            var title  = item.title || item.name || '';
            var poster = normalizePosterUrl(item.posterLocalPath || item.posterPath || item.coverUrl || '');
            return '<div class="chat-share-result" onclick="selectContent(' + item.id + ',\'' +
                   escapeJs(title) + '\',\'' + escapeJs(poster) + '\')">' + escapeHtml(title) + '</div>';
        }).join('');
    }

    function normalizePosterUrl(path) {
        if (!path) return '';
        if (path.indexOf('image.tmdb.org') >= 0) return '';
        if (path.indexOf('http://') === 0 || path.indexOf('https://') === 0 || path.indexOf('/supabase-images/') === 0 || path.indexOf('/images/') === 0) return path;
        if (path.indexOf('supabase-images/') === 0 || path.indexOf('images/') === 0) return '/' + path;
        return '';
    }

    function selectContent(id, title, poster) {
        sharedContent = { type: shareType, id: id, title: title, poster: poster };
        document.getElementById('sharePanel').style.display = 'none';
        var preview = document.getElementById('sharedContentPreview');
        preview.style.display = 'flex';
        document.getElementById('sharedTitle').textContent = title;
        var icon = shareType === 'series' ? 'fa-tv' : (shareType === 'book' ? 'fa-book' : 'fa-film');
        document.getElementById('sharedIcon').className = 'fas ' + icon;
    }

    function clearShared() {
        sharedContent = null;
        document.getElementById('sharedContentPreview').style.display = 'none';
    }

    // ── Utilidades ─────────────────────────────────────────────────────────────
    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escapeJs(s) {
        if (!s) return '';
        return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    }

}); // DOMContentLoaded
</script>
</body>
</html>
