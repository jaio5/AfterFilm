<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Admin AfterFilm</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="Afterfilms" class="site-logo">
                <span style="font-size:0.65rem;font-weight:700;letter-spacing:0.1em;background:var(--accent);color:#fff;padding:0.15rem 0.45rem;border-radius:4px;vertical-align:middle;margin-left:0.4rem;">ADMIN</span>
            </a>
            <button class="navbar-menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" onclick="const nav=this.closest('.navbar'); nav.classList.toggle('menu-open'); this.setAttribute('aria-expanded', nav.classList.contains('menu-open'));"><i class="fas fa-bars"></i></button>

            <div class="navbar-nav-links">
                <a th:href="@{/admin}"><i class="fas fa-arrow-left"></i> Panel</a>
                <a th:href="@{/}"><i class="fas fa-home"></i> App</a>
                <a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Salir</a>
            </div>
        </div>
    </nav>

    <div class="admin-wrapper">
        <div class="admin-page-title"><i class="fas fa-users" style="color:var(--accent);margin-right:0.5rem"></i>Gestión de Usuarios</div>
        <div class="admin-page-subtitle">Administra usuarios, roles y permisos</div>

        <!-- Error -->
        <div th:if="${error}" style="background:rgba(230,57,70,0.1);border:1px solid rgba(230,57,70,0.3);border-radius:var(--radius);padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.85rem;color:#fca5a5">
            <i class="fas fa-exclamation-triangle" style="margin-right:0.4rem"></i>
            <span th:text="${error}">Error</span>
        </div>

        <!-- Search + stats bar -->
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap">
            <form th:action="@{/admin/users}" method="get" style="display:flex;gap:0.5rem;flex:1;min-width:220px">
                <input type="text" name="search" th:value="${search}" placeholder="Buscar por usuario…"
                       style="flex:1;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:0.5rem 0.75rem;color:var(--text-primary);font-size:0.85rem"
                       aria-label="Buscar usuario">
                <button type="submit" class="btn-ghost" style="font-size:0.82rem;padding:0.5rem 0.9rem">
                    <i class="fas fa-search"></i>
                </button>
                <a th:if="${search}" th:href="@{/admin/users}" class="btn-ghost" style="font-size:0.82rem;padding:0.5rem 0.9rem">
                    <i class="fas fa-times"></i>
                </a>
            </form>
            <div class="admin-stat-card" style="text-align:right;padding:0.75rem 1.25rem">
                <div class="stat-label">Total usuarios</div>
                <div class="stat-value" style="font-size:1.4rem" th:text="${totalUsers}">0</div>
            </div>
        </div>

        <!-- User table -->
        <div class="admin-section">
            <div style="overflow-x:auto">
                <table class="admin-table" aria-label="Lista de usuarios">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th>Confirmado</th>
                            <th>Estado</th>
                            <th>Infracciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td>
                                <div style="font-weight:500;color:var(--text-primary)" th:text="${user.username}">username</div>
                                <div style="font-size:0.75rem;color:var(--text-muted)" th:text="${user.displayName ?: ''}"></div>
                            </td>
                            <td style="font-size:0.82rem" th:text="${user.email}">email@example.com</td>
                            <td>
                                <span th:each="role : ${user.roles}"
                                      th:class="${role.name == 'ROLE_ADMIN' ? 'badge-warn' : 'badge-info'}"
                                      th:text="${role.name}"
                                      style="margin-right:0.25rem">ROLE</span>
                            </td>
                            <td>
                                <span th:if="${user.emailConfirmed}"  class="badge-ok"><i class="fas fa-check"></i> Sí</span>
                                <span th:unless="${user.emailConfirmed}" class="badge-warn"><i class="fas fa-clock"></i> Pendiente</span>
                            </td>
                            <td>
                                <span th:if="${user.banned}" class="badge-err"><i class="fas fa-ban"></i> Permanente</span>
                                <span th:if="${!user.banned and user.bannedUntil != null}" class="badge-warn"><i class="fas fa-clock"></i> Temporal</span>
                                <span th:if="${!user.banned and user.bannedUntil == null}" class="badge-ok"><i class="fas fa-check-circle"></i> Activo</span>
                            </td>
                            <td>
                                <div style="font-size:0.82rem">
                                    <span th:if="${user.offenseCount > 0}"
                                          th:class="${user.offenseCount >= 5 ? 'badge-err' : user.offenseCount >= 3 ? 'badge-warn' : 'badge-info'}"
                                          th:text="${user.offenseCount + ' infracción' + (user.offenseCount != 1 ? 'es' : '')}">0</span>
                                    <span th:if="${user.offenseCount == 0}" class="badge-muted">Sin infracciones</span>
                                    <div th:if="${user.bannedUntil != null}"
                                         style="font-size:0.72rem;color:var(--text-muted);margin-top:0.2rem"
                                         th:text="'Hasta: ' + ${user.bannedUntil}"></div>
                                    <div th:if="${user.banReason != null}"
                                         style="font-size:0.72rem;color:var(--text-muted)"
                                         th:text="${user.banReason}"></div>
                                </div>
                            </td>
                            <td>
                                <div style="display:flex;flex-direction:column;gap:0.3rem">
                                    <button th:unless="${user.emailConfirmed}"
                                            type="button"
                                            class="btn-ghost"
                                            style="font-size:0.73rem;padding:0.2rem 0.55rem"
                                            onclick="confirmEmail(this)"
                                            th:data-user-id="${user.id}">
                                        <i class="fas fa-envelope-check"></i> Confirmar email
                                    </button>
                                    <button th:unless="${user.banned}"
                                            type="button"
                                            class="btn-ghost ban-btn"
                                            style="font-size:0.73rem;padding:0.2rem 0.55rem;color:#fde68a;border-color:rgba(251,191,36,0.3)"
                                            onclick="banUser(this)"
                                            th:data-user-id="${user.id}">
                                        <i class="fas fa-ban"></i> Banear
                                    </button>
                                    <button th:if="${user.banned}"
                                            type="button"
                                            class="btn-ghost unban-btn"
                                            style="font-size:0.73rem;padding:0.2rem 0.55rem;color:#86efac;border-color:rgba(34,197,94,0.3)"
                                            onclick="unbanUser(this)"
                                            th:data-user-id="${user.id}">
                                        <i class="fas fa-user-check"></i> Desbanear
                                    </button>
                                    <button th:if="${user.offenseCount > 0}"
                                            type="button"
                                            class="btn-ghost reset-btn"
                                            style="font-size:0.73rem;padding:0.2rem 0.55rem;color:#93c5fd;border-color:rgba(59,130,246,0.3)"
                                            onclick="resetOffenses(this)"
                                            th:data-user-id="${user.id}">
                                        <i class="fas fa-rotate-left"></i> Resetear
                                    </button>
                                    <button type="button"
                                            class="btn-ghost delete-btn"
                                            style="font-size:0.73rem;padding:0.2rem 0.55rem;color:#fca5a5;border-color:rgba(230,57,70,0.3)"
                                            onclick="deleteUser(this)"
                                            th:data-user-id="${user.id}"
                                            th:data-username="${user.username}">
                                        <i class="fas fa-trash"></i> Eliminar
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" style="text-align:center;color:var(--text-muted)">No hay usuarios</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" style="display:flex;align-items:center;justify-content:center;gap:0.25rem;padding:1.5rem 0">
            <a th:if="${hasPrevious}" th:href="@{/admin/users(page=${currentPage - 1},search=${search})}"
               style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:0.4rem 0.75rem;font-size:0.875rem;color:var(--text-secondary)">&laquo;</a>
            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:href="@{/admin/users(page=${i},search=${search})}"
                   th:text="${i + 1}"
                   th:style="${i == currentPage ? 'background:var(--accent);border:1px solid var(--accent);border-radius:var(--radius);padding:0.4rem 0.75rem;font-size:0.875rem;color:#fff' : 'background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:0.4rem 0.75rem;font-size:0.875rem;color:var(--text-secondary)'}">1</a>
            </span>
            <a th:if="${hasNext}" th:href="@{/admin/users(page=${currentPage + 1},search=${search})}"
               style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:0.4rem 0.75rem;font-size:0.875rem;color:var(--text-secondary)">&raquo;</a>
        </div>
    </div>

    <script>
        function confirmEmail(btn) {
            const userId = btn.getAttribute('data-user-id');
            if (confirm('¿Confirmar email de este usuario?')) {
                performAction('/api/admin/users/' + userId + '/confirm-email', 'POST');
            }
        }

        function banUser(btn) {
            const userId = btn.getAttribute('data-user-id');
            if (confirm('¿Banear este usuario?')) {
                performAction('/api/admin/users/' + userId + '/ban', 'POST');
            }
        }

        function unbanUser(btn) {
            const userId = btn.getAttribute('data-user-id');
            if (confirm('¿Desbanear este usuario?')) {
                performAction('/api/admin/users/' + userId + '/unban', 'POST');
            }
        }

        function resetOffenses(btn) {
            const userId = btn.getAttribute('data-user-id');
            if (confirm('¿Resetear infracciones y ban temporal de este usuario?')) {
                performAction('/api/admin/users/' + userId + '/reset-offenses', 'POST');
            }
        }

        function deleteUser(btn) {
            const userId   = btn.getAttribute('data-user-id');
            const username = btn.getAttribute('data-username');
            if (confirm('¿ELIMINAR PERMANENTEMENTE al usuario "' + username + '"? Esta acción NO se puede deshacer.')) {
                if (confirm('¿Estás COMPLETAMENTE SEGURO?')) {
                    performAction('/api/admin/users/' + userId + '/delete', 'POST');
                }
            }
        }

        function performAction(url, method) {
            fetch(url, { method, headers: { 'Content-Type': 'application/json' } })
                .then(r => r.text())
                .then(data => { alert(data); window.location.reload(); })
                .catch(err => alert('Error: ' + err.message));
        }

        // Hide action buttons for SUPERADMIN rows
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('tbody tr').forEach(function(row) {
                const badges = row.querySelectorAll('.badge-warn, .badge-info');
                let isSuperAdmin = false;
                badges.forEach(b => { if (b.textContent.includes('ROLE_SUPERADMIN')) isSuperAdmin = true; });
                if (isSuperAdmin) {
                    row.querySelector('.delete-btn')?.remove();
                    row.querySelector('.ban-btn')?.remove();
                    row.querySelector('.unban-btn')?.remove();
                    row.querySelector('.reset-btn')?.remove();
                }
            });
        });
    </script>
</body>
</html>
