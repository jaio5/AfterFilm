<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Películas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <script th:src="@{/js/security.js}" src="/js/security.js"></script>
</head>
<body>
<header>
    <h1>Películas</h1>
    <nav>
        <a th:href="@{/}">Inicio</a>
    </nav>
</header>
<main>
    <table>
        <thead>
            <tr><th>ID</th><th>Título</th><th>Año</th></tr>
        </thead>
        <tbody>
            <tr th:each="p : ${peliculas}">
                <td th:text="${p.id}">1</td>
                <td><a th:href="@{/pelicula/{id}(id=${p.id})}" th:text="${p.title != null ? p.title : p.titulo}">Título</a></td>
                <td th:text="${p.releaseDate != null ? p.releaseDate : p.anio}">2020</td>
            </tr>
        </tbody>
    </table>
    <div th:if="${peliculas == null || #lists.isEmpty(peliculas)}">
        <p>No hay películas para mostrar.</p>
    </div>
</main>
</body>
</html>
