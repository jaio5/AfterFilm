<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — PelisApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}"><i class="fas fa-film"></i> PelisApp</a>
            <div class="navbar-nav-links">
                <a th:href="@{/}"><i class="fas fa-home"></i> Inicio</a>
                <a th:href="@{/perfil}" sec:authorize="isAuthenticated()"><i class="fas fa-user"></i> Mi Perfil</a>
                <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Entrar</a>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="margin:0">
                    <button type="submit" class="btn-text">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Profile hero -->
    <div class="profile-hero">
        <div class="profile-hero-inner">
            <div class="profile-avatar-circle">
                <span th:text="${#strings.substring(user.displayName ?: user.username, 0, 1).toUpperCase()}">U</span>
            </div>
            <div>
                <h1 class="profile-name" th:text="${user.displayName ?: user.username}">Nombre</h1>
                <div class="profile-username" th:text="'@' + ${user.username}">@usuario</div>
                <div class="profile-stats">
                    <div class="profile-stat">
                        <strong th:text="${reviewCount}">0</strong> reseñas
                    </div>
                    <div class="profile-stat" th:if="${reviewCount > 0}">
                        Media:
                        <strong th:text="${#numbers.formatDecimal(avgRating, 1, 1)}">0.0</strong>
                        <i class="fas fa-star" style="color:#f59e0b;font-size:0.75rem;"></i>
                    </div>
                    <div class="profile-stat" th:text="${user.email}">email@ejemplo.com</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="profile-content">
        <a href="javascript:history.back()" class="back-link">
            <i class="fas fa-arrow-left"></i> Volver
        </a>

        <p class="section-title" style="margin-top:1.5rem;">Mis reseñas</p>

        <div th:if="${#lists.isEmpty(reviews)}" class="empty-state">
            <i class="fas fa-film"></i>
            <p>Aún no has valorado ninguna película.</p>
            <a th:href="@{/}" class="btn-accent btn-sm" style="margin-top:0.75rem;">Explorar catálogo</a>
        </div>

        <div th:each="review : ${reviews}" class="profile-review-card">
            <!-- Poster placeholder (evita lazy loading de relaciones) -->
            <div class="profile-review-poster-placeholder">
                <i class="fas fa-film"></i>
            </div>
            <!-- Review body -->
            <div class="profile-review-body">
                <a th:href="@{/pelicula/{id}(id=${review.movie.id})}"
                   class="profile-review-title"
                   th:text="${review.movie.title}">Título película</a>
                <div class="profile-review-stars">
                    <span th:each="i : ${#numbers.sequence(1, review.stars)}" class="fas fa-star"></span>
                    <span th:each="i : ${#numbers.sequence(review.stars + 1, 5)}" class="far fa-star"
                          style="color:var(--bg-elevated)"></span>
                </div>
                <div class="profile-review-text"
                     th:if="${review.text != null and !review.text.trim().isEmpty()}"
                     th:text="${review.text}">Texto reseña</div>
                <div class="profile-review-text"
                     th:unless="${review.text != null and !review.text.trim().isEmpty()}"
                     style="font-style:italic;color:var(--text-muted)">Sin comentario</div>
                <div class="profile-review-date"
                     th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy')}">01/01/2023</div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        © 2026 PelisApp — <i class="fas fa-heart text-accent"></i> por el cine
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
