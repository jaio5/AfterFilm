<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfterFilm — Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-film"></i> AfterFilm
            </a>
            <div class="navbar-search">
                <form id="searchForm">
                    <input type="search" id="searchInput" placeholder="Buscar películas..." autocomplete="off">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>
            <button class="navbar-menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" onclick="const nav=this.closest('.navbar'); nav.classList.toggle('menu-open'); this.setAttribute('aria-expanded', nav.classList.contains('menu-open'));"><i class="fas fa-bars"></i></button>

            <div class="navbar-nav-links">
                <a th:href="@{/}" style="color:var(--accent)"><i class="fas fa-film"></i> Películas</a>
                <a th:href="@{/series}"><i class="fas fa-tv"></i> Series</a>
                <a th:href="@{/libros}"><i class="fas fa-book"></i> Libros</a>
                <a th:href="@{/usuarios}"><i class="fas fa-users"></i> Usuarios</a>
                <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Entrar</a>
                <a th:href="@{/register}" sec:authorize="!isAuthenticated()" class="btn-accent btn-sm">Registrarse</a>
                <div class="user-menu" sec:authorize="isAuthenticated()">
                    <button class="user-avatar-btn" id="userAvatarBtn">
                        <span class="user-avatar-initial" th:text="${#authentication.name.substring(0,1)}">U</span>
                        <span id="chatNavBadge" class="chat-nav-badge" style="display:none"></span>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="user-dropdown-header">
                            <span class="user-dropdown-name" th:text="${#authentication.name}">Usuario</span>
                        </div>
                        <a th:href="@{/perfil}" class="user-dropdown-item"><i class="fas fa-user"></i> Mi perfil</a>
                        <a th:href="@{/feed}" class="user-dropdown-item"><i class="fas fa-stream"></i> Mi feed</a>
                        <a th:href="@{/chat}" class="user-dropdown-item"><i class="fas fa-comments"></i> Mensajes</a>
                        <a th:href="@{/perfil}" class="user-dropdown-item"><i class="fas fa-cog"></i> Ajustes</a>
                        <a th:href="@{/admin}"
                           th:if="${#authentication.authorities.?[authority == 'ROLE_ADMIN'].size() > 0}"
                           class="user-dropdown-item user-dropdown-item-admin"><i class="fas fa-shield-alt"></i> Panel de Admin</a>
                        <div class="user-dropdown-divider"></div>
                        <form th:action="@{/logout}" method="post" style="margin:0">
                            <button type="submit" class="user-dropdown-item user-dropdown-item-logout"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero-section" id="heroSection" style="display:none">
        <div class="hero-backdrop" id="heroBackdrop"></div>
        <div class="hero-gradient"></div>
        <div class="hero-content">
            <div class="hero-eyebrow" id="heroEyebrow"></div>
            <h2 class="hero-title" id="heroTitle"></h2>
            <p class="hero-synopsis" id="heroSynopsis"></p>
            <div class="hero-actions">
                <a class="btn-accent" id="heroWatchLink" href="#"><i class="fas fa-star"></i> Ver reseñas</a>
                <a class="btn-ghost" id="heroInfoLink" href="#">+ Más info</a>
            </div>
        </div>
    </section>

    <!-- Main -->
    <div class="container-main">
        <div class="catalog-layout">

            <!-- ── Sidebar: categorías (solo escritorio) ── -->
            <aside class="catalog-sidebar">
                <div class="sidebar-section-title"><i class="fas fa-th-list"></i> Géneros</div>
                <button class="sidebar-pill active" data-genre="">Todas</button>
                <button th:each="cat : ${categories}"
                        class="sidebar-pill"
                        th:attr="data-genre=${cat.name}"
                        th:text="${cat.name}">Género</button>
            </aside>

            <!-- ── Contenido principal ── -->
            <div class="catalog-main">

                <!-- Catalog bar -->
                <div class="catalog-bar">
                    <span class="catalog-title" id="catalog-title">Catálogo</span>
                    <span class="catalog-count" id="catalog-info"></span>
                </div>

                <!-- Movies grid -->
                <div id="movies-container" class="movies-grid"></div>

                <!-- Pagination -->
                <div id="pagination-container"></div>

            </div>
        </div>
    </div>

    <footer class="site-footer">
        © 2026 AfterFilm — Hecho con <i class="fas fa-heart text-accent"></i> por el cine
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
const moviesContainer = document.getElementById('movies-container');
const paginationContainer = document.getElementById('pagination-container');
const catalogTitle = document.getElementById('catalog-title');
const catalogInfo = document.getElementById('catalog-info');
const PAGE_SIZE = 24;

let currentPage = 0;
let currentGenre = null;
let searchTimeout = null;

function normalizePosterUrl(path) {
    if (!path) return null;
    if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('/supabase-images/') || path.startsWith('/images/')) return path;
    if (path.startsWith('supabase-images/') || path.startsWith('images/')) return '/' + path;
    if (path.startsWith('/')) return 'https://image.tmdb.org/t/p/w500' + path;
    return path;
}

function resolvePoster(item) {
    return item ? (normalizePosterUrl(item.posterLocalPath) || normalizePosterUrl(item.posterPath)) : null;
}

function loadMovies(page = 0, genre = null) {
    const url = genre
        ? `/api/movies/by-category?category=${encodeURIComponent(genre)}&page=${page}&size=${PAGE_SIZE}`
        : `/api/movies?page=${page}&size=${PAGE_SIZE}`;
    fetch(url)
        .then(res => res.json())
        .then(data => {
            renderMovies(data.content);
            renderPagination(data);
            catalogTitle.textContent = genre ? genre : 'Catálogo';
            catalogInfo.textContent = `${data.numberOfElements} de ${data.totalElements} películas`;
            currentPage = data.number;
            currentGenre = genre;
        });
}

function populateHero(movie) {
    const poster = resolvePoster(movie);
    if (!poster) return;
    document.getElementById('heroBackdrop').style.backgroundImage = `url('${poster}')`;
    document.getElementById('heroEyebrow').textContent = '★ Mejor valorada del mes';
    document.getElementById('heroTitle').textContent = movie.title || '';
    document.getElementById('heroSynopsis').textContent = movie.description || movie.overview || '';
    const url = `/pelicula/${movie.id}`;
    document.getElementById('heroWatchLink').href = url;
    document.getElementById('heroInfoLink').href = url;
    document.getElementById('heroSection').style.display = '';
}

function renderMovies(movies) {
    moviesContainer.innerHTML = '';
    if (!movies || movies.length === 0) {
        moviesContainer.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <i class="fas fa-film"></i>
                <p>No hay películas disponibles</p>
            </div>`;
        return;
    }
    movies.forEach(movie => {
        const poster = resolvePoster(movie);
        moviesContainer.innerHTML += `
        <div class="movie-card">
            <a href="/pelicula/${movie.id}" class="movie-card-link">
                <div class="movie-poster-wrap">
                    ${poster
                        ? `<img src="${poster}" alt="${movie.title}" loading="lazy">`
                        : `<div class="movie-poster-placeholder"><i class="fas fa-film"></i></div>`}
                    ${movie.avgRating ? `<div class="movie-rating-badge">
                        <i class="fas fa-star"></i> ${Number(movie.avgRating).toFixed(1)}
                    </div>` : ''}
                    <div class="movie-card-overlay">
                        <div class="movie-card-overlay-info">
                            <div class="movie-card-overlay-title">${movie.title || 'Sin título'}</div>
                            <div class="movie-card-overlay-year">${getYear(movie.releaseDate)}</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>`;
    });
}

function renderPagination(data) {
    paginationContainer.innerHTML = '';
    if (data.totalPages <= 1) return;
    let html = `<nav aria-label="Paginación"><ul class="pagination">`;
    html += `<li class="page-item${data.first ? ' disabled' : ''}"><a class="page-link" href="#" onclick="loadMovies(${data.number - 1}, currentGenre);return false;"><i class="fas fa-chevron-left"></i></a></li>`;

    const maxPages = 5;
    let start = Math.max(0, data.number - 2);
    let end = Math.min(data.totalPages - 1, data.number + 2);
    if (data.number <= 2) end = Math.min(data.totalPages - 1, maxPages - 1);
    if (data.number >= data.totalPages - 3) start = Math.max(0, data.totalPages - maxPages);

    if (start > 0) {
        html += `<li class="page-item"><a class="page-link" href="#" onclick="loadMovies(0, currentGenre);return false;">1</a></li>`;
        if (start > 1) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
    }
    for (let i = start; i <= end; i++) {
        html += `<li class="page-item${i === data.number ? ' active' : ''}"><a class="page-link" href="#" onclick="loadMovies(${i}, currentGenre);return false;">${i + 1}</a></li>`;
    }
    if (end < data.totalPages - 1) {
        if (end < data.totalPages - 2) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        html += `<li class="page-item"><a class="page-link" href="#" onclick="loadMovies(${data.totalPages - 1}, currentGenre);return false;">${data.totalPages}</a></li>`;
    }
    html += `<li class="page-item${data.last ? ' disabled' : ''}"><a class="page-link" href="#" onclick="loadMovies(${data.number + 1}, currentGenre);return false;"><i class="fas fa-chevron-right"></i></a></li>`;
    html += `</ul></nav>`;
    paginationContainer.innerHTML = html;
}

function getYear(releaseDate) {
    if (!releaseDate) return '';
    if (Array.isArray(releaseDate) && releaseDate.length > 0) return releaseDate[0];
    if (typeof releaseDate === 'string' && releaseDate.length >= 4) return releaseDate.substring(0, 4);
    return '';
}

window.loadMovies = loadMovies;

function selectGenre(genre) {
    // Sincronizar sidebar y filtro móvil
    document.querySelectorAll('.sidebar-pill').forEach(b => b.classList.toggle('active', b.dataset.genre === genre));
    document.querySelectorAll('#filterBar .filter-pill').forEach(b => b.classList.toggle('active', b.dataset.genre === genre));
    document.getElementById('heroSection').style.display = genre ? 'none' : '';
    loadMovies(0, genre || null);
}

document.addEventListener('DOMContentLoaded', function() {
    // Cargar hero independientemente del catálogo
    fetch('/api/movies/top-rated-this-month')
        .then(res => res.ok ? res.json() : null)
        .then(movie => { if (movie) populateHero(movie); });

    // Sidebar (escritorio)
    document.querySelectorAll('.sidebar-pill').forEach(btn => {
        btn.addEventListener('click', function() { selectGenre(this.dataset.genre); });
    });


    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    if (searchForm && searchInput) {
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) { loadMovies(0, currentGenre); return; }
            fetch(`/api/movies/search?query=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('heroSection').style.display = 'none';
                    renderMovies(data);
                    paginationContainer.innerHTML = '';
                    catalogTitle.textContent = `"${query}"`;
                    catalogInfo.textContent = `${data.length} resultado${data.length !== 1 ? 's' : ''}`;
                    if (!data || data.length === 0) {
                        moviesContainer.innerHTML += `
                            <div style="grid-column:1/-1;text-align:center;padding-top:1rem;">
                                <button class="btn-ghost btn-sm" onclick="loadMovies(0,null);document.getElementById('searchInput').value='';">
                                    <i class="fas fa-arrow-left"></i> Ver catálogo completo
                                </button>
                            </div>`;
                    }
                })
                .catch(() => {
                    renderMovies([]);
                    paginationContainer.innerHTML = '';
                    catalogTitle.textContent = `"${query}"`;
                    catalogInfo.textContent = 'No se pudo realizar la búsqueda';
                });
        });

        // También limpiar resultados cuando se borra la búsqueda con la X del input
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function() {
                searchForm.requestSubmit();
            }, 250);
        });

        searchInput.addEventListener('search', function() {
            if (!this.value) loadMovies(0, currentGenre);
        });
    }

    loadMovies(0, null);
});
    </script>
<script>
(function() {
    var btn = document.getElementById('userAvatarBtn');
    var dd = document.getElementById('userDropdown');
    if (!btn || !dd) return;
    btn.addEventListener('click', function(e) { e.stopPropagation(); dd.classList.toggle('open'); });
    document.addEventListener('click', function() { dd.classList.remove('open'); });
})();

// Badge de mensajes no leídos
(function() {
    var badge = document.getElementById('chatNavBadge');
    if (!badge) return;
    function refreshBadge() {
        fetch('/api/chat/unread')
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(data) {
                if (!data) return;
                var count = data.count || 0;
                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                    badge.style.display = '';
                } else {
                    badge.style.display = 'none';
                }
            })
            .catch(function() {});
    }
    refreshBadge();
    setInterval(refreshBadge, 30000);
})();
</script>
</body>
</html>
