<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — AfterFilm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="auth-page">
        <div style="text-align:center;max-width:480px;">
            <div style="font-size:3rem;color:var(--text-muted);margin-bottom:1.5rem;">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <h1 style="font-size:1.5rem;font-weight:500;letter-spacing:-0.02em;margin-bottom:0.75rem;">
                Algo salió mal
            </h1>
            <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:2rem;"
               th:text="${error ?: 'Ha ocurrido un error inesperado. Inténtalo de nuevo.'}">
                Error desconocido
            </p>
            <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
                <a th:href="@{/}" class="btn-accent">
                    <i class="fas fa-home"></i> Volver al inicio
                </a>
                <button onclick="history.back()" class="btn-ghost">
                    <i class="fas fa-arrow-left"></i> Regresar
                </button>
            </div>
        </div>
    </div>
</body>
</html>
