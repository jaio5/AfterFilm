services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pelisapp
      POSTGRES_USER: pelisapp
      POSTGRES_PASSWORD: pelisapp123
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelisapp -d pelisapp"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pelisapp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_HOST: db
      SPRING_DATASOURCE_PORT: 5432
      SPRING_DATASOURCE_DB: pelisapp
      SPRING_DATASOURCE_USERNAME: pelisapp
      SPRING_DATASOURCE_PASSWORD: pelisapp123
      APP_JWT_SECRET: development-secret-key-change-in-production-32-chars
      MAIL_PASSWORD: wvyj mheo fxmf hvip
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_BEARER_TOKEN: eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJiNjE5M2U4NTJmYTUwYTRhZGQyZWIwMWRkZmJhODA0MyIsIm5iZiI6MTc0MTk4ODM3OC40MjEsInN1YiI6IjY3ZDRhMjFhOTE2NWYzNzExODAxMDU0MSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.ilHPYl4g_8fRgOQhy1Q2GyulkxtxebcqjgUE4VshqTM
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./data:/app/data
    networks:
      - pelisapp-network

volumes:
  pg_data:

networks:
  pelisapp-network:
    driver: bridge
