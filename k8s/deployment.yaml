apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelisapp
  labels:
    app: pelisapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pelisapp
  template:
    metadata:
      labels:
        app: pelisapp
    spec:
      containers:
        - name: pelisapp
          image: pelisapp:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
